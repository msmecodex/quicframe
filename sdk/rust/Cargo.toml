[package]
name    = "quicframe-client"
version = "0.1.0"
edition = "2021"
description = "Production-grade Rust client SDK for the QuicFrame QUIC-native API framework"
license = "MIT"
repository = "https://github.com/msmecodex/quicframe/"

[lib]
name = "quicframe"

[[bin]]
name = "qf-example"
path = "src/bin/example.rs"

[dependencies]
# QUIC transport
quinn = { version = "0.11", features = ["rustls"] }
rustls = { version = "0.23", features = ["ring"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"

# Serialization – MsgPack (NOT JSON)
rmp-serde = "1.3"
serde     = { version = "1", features = ["derive"] }

# Connection pool + concurrency
dashmap = "6"
parking_lot = "0.12"

# Utilities
uuid    = { version = "1", features = ["v4"] }
thiserror = "1"
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"
